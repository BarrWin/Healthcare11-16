name: Deploy pipeline to AWS
on:
  push:
    branches: [main]
    paths: [glue/**, infra/**, .github/workflows/deploy.yml]
  workflow_dispatch:

permissions:
  id-token: write   # lets GitHub request a short-lived AWS token (no stored keys)
  contents: read

env:
  AWS_REGION: us-east-1
  STACK: healthcare-metrics

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show OIDC claims (temporary debug)
        run: |
          RESP=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com")
          echo "$RESP" | python3 -c "
          import sys, json, base64
          t = json.load(sys.stdin)['value'].split('.')[1]
          t += '=' * (-len(t) % 4)
          d = json.loads(base64.urlsafe_b64decode(t))
          print({k: d[k] for k in ['sub', 'aud', 'iss', 'repository', 'ref', 'job_workflow_ref'] if k in d})
          "
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}   # repo variable, not a secret
          aws-region: ${{ env.AWS_REGION }}
      - name: Update stack (buckets, jobs, workflow, schedule)
        run: |
          aws cloudformation deploy --stack-name "$STACK" --template-file infra/template.yaml \
            --capabilities CAPABILITY_NAMED_IAM --no-fail-on-empty-changeset \
            --parameter-overrides DriveFolderId="${{ vars.DRIVE_FOLDER_ID }}"
      - name: Upload Glue scripts
        run: |
          RAW=$(aws cloudformation describe-stacks --stack-name "$STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='RawBucketName'].OutputValue" --output text)
          aws s3 sync glue "s3://$RAW/_scripts/" --exclude "*" --include "*.py"
